[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "clearframe"
version = "0.1.0"
description = "Local image and video restoration pipelines"
readme = "README.md"
requires-python = ">=3.12,<3.13"

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]
markers = ["model: tests that load full restoration model weights"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
